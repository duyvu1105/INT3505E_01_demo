version: '3.8'

services:
  # Prometheus - Time series database & monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: week10-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - monitoring

  # Grafana - Visualization & dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: week10-grafana
    ports:
      - "3001:3000"  # Port 3001 để tránh conflict với app (port 3000)
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    restart: unless-stopped
    networks:
      - monitoring
    depends_on:
      - prometheus

  # Optional: Alertmanager - Alert management
  # Uncomment nếu muốn dùng alerting
  # alertmanager:
  #   image: prom/alertmanager:latest
  #   container_name: week10-alertmanager
  #   ports:
  #     - "9093:9093"
  #   volumes:
  #     - ./alertmanager/config.yml:/etc/alertmanager/config.yml
  #     - alertmanager-data:/alertmanager
  #   command:
  #     - '--config.file=/etc/alertmanager/config.yml'
  #     - '--storage.path=/alertmanager'
  #   restart: unless-stopped
  #   networks:
  #     - monitoring

volumes:
  prometheus-data:
  grafana-data:
  # alertmanager-data:

networks:
  monitoring:
    driver: bridge
